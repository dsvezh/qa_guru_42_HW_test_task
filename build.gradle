plugins {
    id 'java'
    id 'io.qameta.allure' version '4.3.0'
}

group = 'ru.galamart'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def junitVersion = '5.14.2'
def allureVersion = '2.35.5'

allure {
    version = '2.42.1'
    adapter {
        allureJavaVersion = allureVersion
        aspectjWeaver = true
    }
}

dependencies {
    testImplementation 'com.codeborne:selenide:7.16.2'
    testImplementation 'org.aeonbits.owner:owner:1.0.12'
    testImplementation "io.qameta.allure:allure-selenide:$allureVersion"
    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.14.2"
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('allureReport') {
    clean = true
}

test {
    useJUnitPlatform()
    finalizedBy tasks.named('allureReport')
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'test.city', System.getProperty('test.city', 'Екатеринбург')
    def defaultRunType = System.getProperty('remoteUrl', '').isBlank() ? 'local' : 'remote'
    systemProperty 'run.type', System.getProperty('run.type', defaultRunType)
    ['base.url': 'baseUrl', 'browser.name': 'selenide.browser', 'browser.version': 'browserVersion',
     'remote.url': 'remoteUrl', 'video.url': 'videoUrl'].each { name, alias ->
        def value = System.getProperty(name, System.getProperty(alias))
        if (value != null) {
            systemProperty name, name == 'browser.name' ? value.toUpperCase(Locale.ROOT) : value
        }
    }
    if (System.getProperty('browserSize') != null) {
        systemProperty 'browserSize', System.getProperty('browserSize')
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'short'
    }
}

