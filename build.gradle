plugins {
    id 'java'
    id 'io.qameta.allure' version '4.3.0'
}

group = 'ru.galamart'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def junitVersion = '5.14.2'
def allureVersion = '2.35.5'

allure {
    version = '2.42.1'
    adapter {
        allureJavaVersion = allureVersion
        aspectjWeaver = true
    }
}

dependencies {
    testImplementation 'com.codeborne:selenide:7.16.2'
    testImplementation "io.qameta.allure:allure-selenide:$allureVersion"
    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.14.2"
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('allureReport') {
    clean = true
}

test {
    useJUnitPlatform()
    finalizedBy tasks.named('allureReport')
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'selenide.browser', System.getProperty('selenide.browser', 'chrome')
    systemProperty 'baseUrl', System.getProperty('baseUrl', 'https://galamart.ru')
    systemProperty 'test.city', System.getProperty('test.city', 'Екатеринбург')
    ['remoteUrl', 'videoUrl', 'browserVersion', 'browserSize'].each { propertyName ->
        if (System.getProperty(propertyName) != null) {
            systemProperty propertyName, System.getProperty(propertyName)
        }
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'short'
    }
}

